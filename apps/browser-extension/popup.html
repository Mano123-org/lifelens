<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LifeLens Browser Monitor</title>
  <style>
    body { width: 280px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; color: #14183a; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cfd5ec; border-radius: 6px; }
    button { margin-top: 14px; width: 100%; padding: 9px; border: 0; border-radius: 6px; background: #5563f0; color: white; cursor: pointer; }
    .status { margin-top: 10px; color: #0f806f; }
    .muted { color: #5c6694; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>LifeLens Monitor</h1>
  <p class="muted">Only the active website hostname is recorded, once per minute, while monitoring is enabled.</p>
  <label><input id="enabled" type="checkbox"> Enable monitoring</label>
  <label for="apiUrl">LifeLens API URL</label>
  <input id="apiUrl" type="url" placeholder="https://lifelen.ethicxedge.workers.dev">
  <button id="save">Save settings</button>
  <div id="status" class="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
